[project]
name = "voicemos-2026-track3-baseline"
version = "0.1.0"
description = "Baseline system for the VoiceMOS Challenge 2026 Track 3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa",
    "numpy",
    "scipy",
    "speechbrain",
    "torch",
    "torchaudio",
    "torchcodec",
    "transformers",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }